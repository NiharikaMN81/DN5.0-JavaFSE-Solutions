<form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">

  <h2>Reactive Student Enrollment</h2>

  <label>Student Name</label><br>
  <input
    type="text"
    formControlName="studentName">

  <br><br>

  <label>Email</label><br>
  <input
    type="email"
    formControlName="studentEmail">
	<div *ngIf="enrollForm.get('studentEmail')?.errors?.['required'] && enrollForm.get('studentEmail')?.touched">
  Email is required.
</div>

<div *ngIf="enrollForm.get('studentEmail')?.errors?.['email'] && enrollForm.get('studentEmail')?.touched">
  Please enter a valid email.
</div>

<div *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']">
  Email already taken.
</div>

  <br><br>

<label>Course</label><br>
<input
  type="text"
  formControlName="courseId">

<div *ngIf="enrollForm.get('courseId')?.errors?.['required'] && enrollForm.get('courseId')?.touched">
  Course ID is required.
</div>

<div *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode'] && enrollForm.get('courseId')?.touched">
  Course code starting with XX is not allowed.
</div>

<div *ngIf="enrollForm.get('courseId')?.errors?.['courseExists']">
  Course already exists.
</div>

<br><br>
  <label>Preferred Semester</label><br>
  <select formControlName="preferredSemester">
    <option value="Odd">Odd</option>
    <option value="Even">Even</option>
  </select>

  <br><br>
  <div formArrayName="additionalCourses">

  <h3>Additional Courses</h3>

  <button type="button" (click)="addCourse()">
    Add Another Course
  </button>

  <br><br>

  <div *ngFor="let ctrl of additionalCourses.controls; let i = index">

    <input
      [formControlName]="i"
      placeholder="Additional Course">

    <button
      type="button"
      (click)="removeCourse(i)">
      Remove
    </button>

    <br><br>

  </div>

</div>

  <label>
    <input
      type="checkbox"
      formControlName="agreeToTerms">
    I accept the Terms and Conditions
  </label>

  <br><br>

  <button
    type="submit"
    [disabled]="enrollForm.invalid">
    Submit
  </button>

</form>
